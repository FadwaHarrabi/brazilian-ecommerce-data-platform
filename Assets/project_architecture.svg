<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title description">
  <title id="title">Brazilian E-Commerce Data Platform Architecture</title>
  <desc id="description">Modern architecture diagram showing Olist CSV files flowing through pandas ingestion into PostgreSQL bronze, dbt silver and gold models, and Superset and Power BI. Dagster orchestrates the pipeline, with Flyway, Docker Compose, and Terraform supporting the platform.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#4f46e5"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #c7d2fe; }
      .title { font-size: 32px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-size: 16px; fill: #dbeafe; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #475569; }
      .card-title { font-size: 19px; font-weight: 700; }
      .card-copy { font-size: 14px; fill: #475569; }
      .card-note { font-size: 12px; fill: #64748b; }
      .stage { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .infra-title { font-size: 16px; font-weight: 700; }
      .infra-copy { font-size: 13px; fill: #475569; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .control { fill: none; stroke: #4f46e5; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1600" height="920" fill="url(#background)"/>

  <rect x="44" y="34" width="1512" height="150" rx="24" fill="url(#header)"/>
  <circle cx="1470" cy="68" r="95" fill="#ffffff" opacity=".045"/>
  <circle cx="1397" cy="160" r="58" fill="#ffffff" opacity=".04"/>
  <text x="84" y="76" class="eyebrow">DATA PLATFORM · END-TO-END</text>
  <text x="84" y="121" class="title">Brazilian E-Commerce Analytics</text>
  <text x="84" y="153" class="subtitle">From Olist source files to trusted warehouse models and business dashboards</text>
  <rect x="1324" y="84" width="182" height="38" rx="19" fill="#ffffff" opacity=".13"/>
  <text x="1415" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">WAREHOUSE PIPELINE</text>

  <text x="72" y="235" class="section">DATA FLOW</text>
  <text x="1528" y="235" text-anchor="end" class="card-note">Left to right · source to consumption</text>

  <rect x="72" y="276" width="244" height="258" rx="20" class="card" filter="url(#shadow)"/>
  <rect x="72" y="276" width="244" height="8" rx="4" fill="#3b82f6"/>
  <rect x="96" y="306" width="104" height="24" rx="12" fill="#dbeafe"/>
  <text x="148" y="322" text-anchor="middle" class="stage" fill="#1d4ed8">01 · SOURCE</text>
  <text x="96" y="372" class="card-title">Olist CSV files</text>
  <text x="96" y="405" class="card-copy">9 business datasets</text>
  <text x="96" y="438" class="card-note">Customers · orders · items</text>
  <text x="96" y="460" class="card-note">Payments · reviews · products</text>
  <text x="96" y="482" class="card-note">Sellers · geolocation · categories</text>
  <rect x="96" y="500" width="196" height="1" fill="#e2e8f0"/>
  <text x="96" y="520" class="card-note">data/*.csv</text>

  <rect x="365" y="276" width="250" height="258" rx="20" class="card" filter="url(#shadow)"/>
  <rect x="365" y="276" width="250" height="8" rx="4" fill="#8b5cf6"/>
  <rect x="389" y="306" width="119" height="24" rx="12" fill="#ede9fe"/>
  <text x="448" y="322" text-anchor="middle" class="stage" fill="#6d28d9">02 · INGEST</text>
  <text x="389" y="372" class="card-title">Pandas ingestion</text>
  <text x="389" y="405" class="card-copy">Dagster ingestion assets</text>
  <text x="389" y="438" class="card-note">Read CSVs and load raw rows</text>
  <text x="389" y="460" class="card-note">into PostgreSQL bronze tables</text>
  <rect x="389" y="500" width="202" height="1" fill="#e2e8f0"/>
  <text x="389" y="520" class="card-note">Current load strategy: full refresh</text>

  <rect x="664" y="276" width="250" height="258" rx="20" class="card" filter="url(#shadow)"/>
  <rect x="664" y="276" width="250" height="8" rx="4" fill="#10b981"/>
  <rect x="688" y="306" width="115" height="24" rx="12" fill="#d1fae5"/>
  <text x="745" y="322" text-anchor="middle" class="stage" fill="#047857">03 · STORAGE</text>
  <text x="688" y="372" class="card-title">PostgreSQL</text>
  <text x="688" y="405" class="card-copy">Bronze source layer</text>
  <text x="688" y="438" class="card-note">9 relational source tables</text>
  <text x="688" y="460" class="card-note">Loaded by the ingestion assets</text>
  <rect x="688" y="500" width="202" height="1" fill="#e2e8f0"/>
  <text x="688" y="520" class="card-note">Database exposed on port 5566</text>

  <rect x="963" y="276" width="278" height="258" rx="20" class="card" filter="url(#shadow)"/>
  <rect x="963" y="276" width="278" height="8" rx="4" fill="#f59e0b"/>
  <rect x="987" y="306" width="119" height="24" rx="12" fill="#fef3c7"/>
  <text x="1047" y="322" text-anchor="middle" class="stage" fill="#b45309">04 · TRANSFORM</text>
  <text x="987" y="372" class="card-title">dbt warehouse</text>
  <text x="987" y="405" class="card-copy">Bronze → Silver → Gold</text>
  <text x="987" y="438" class="card-note">Clean staging models, then build</text>
  <text x="987" y="460" class="card-note">facts and business dimensions</text>
  <rect x="987" y="500" width="230" height="1" fill="#e2e8f0"/>
  <text x="987" y="520" class="card-note">dbt build · model tests</text>

  <rect x="1290" y="276" width="238" height="258" rx="20" class="card" filter="url(#shadow)"/>
  <rect x="1290" y="276" width="238" height="8" rx="4" fill="#f43f5e"/>
  <rect x="1314" y="306" width="131" height="24" rx="12" fill="#ffe4e6"/>
  <text x="1379" y="322" text-anchor="middle" class="stage" fill="#be123c">05 · CONSUME</text>
  <text x="1314" y="372" class="card-title">BI &amp; analytics</text>
  <text x="1314" y="411" class="card-copy">Apache Superset</text>
  <text x="1314" y="440" class="card-copy">Power BI</text>
  <rect x="1314" y="500" width="190" height="1" fill="#e2e8f0"/>
  <text x="1314" y="520" class="card-note">Dashboards and reporting</text>

  <path d="M316 405 H355" class="flow"/>
  <path d="M615 405 H654" class="flow"/>
  <path d="M914 405 H953" class="flow"/>
  <path d="M1241 405 H1280" class="flow"/>

  <rect x="365" y="578" width="876" height="136" rx="20" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <circle cx="407" cy="620" r="20" fill="#4f46e5"/>
  <path d="M399 620h16M407 612v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="443" y="615" class="card-title" fill="#312e81">Dagster orchestration</text>
  <text x="443" y="644" class="card-copy">Coordinates ingestion and dbt assets as the daily_pipeline job</text>
  <text x="443" y="675" class="card-note">Schedule configured for 06:00 daily · Dagster is run separately from the current Compose stack</text>
  <path d="M490 578 V550" class="control"/>
  <path d="M1110 578 V550" class="control"/>
  <text x="375" y="564" class="card-note" fill="#4338ca">orchestrates</text>
  <text x="1118" y="564" class="card-note" fill="#4338ca">orchestrates</text>

  <text x="72" y="775" class="section">PLATFORM FOUNDATION</text>
  <rect x="72" y="798" width="465" height="84" rx="16" class="card"/>
  <circle cx="108" cy="840" r="18" fill="#dbeafe"/>
  <path d="M100 840h16M108 832v16" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <text x="141" y="834" class="infra-title">Flyway migrations</text>
  <text x="141" y="858" class="infra-copy">Versioned SQL creates the PostgreSQL schemas and tables</text>

  <rect x="568" y="798" width="465" height="84" rx="16" class="card"/>
  <circle cx="604" cy="840" r="18" fill="#d1fae5"/>
  <rect x="595" y="833" width="18" height="14" rx="3" fill="none" stroke="#059669" stroke-width="2"/>
  <path d="M599 829v4m10-4v4" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <text x="637" y="834" class="infra-title">Docker Compose</text>
  <text x="637" y="858" class="infra-copy">Runs PostgreSQL, Flyway, pgAdmin, Redis, and Superset</text>

  <rect x="1064" y="798" width="464" height="84" rx="16" class="card"/>
  <circle cx="1100" cy="840" r="18" fill="#fef3c7"/>
  <path d="m1092 840 6 6 11-13" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1133" y="834" class="infra-title">Terraform</text>
  <text x="1133" y="858" class="infra-copy">PostgreSQL provider and database configuration</text>
</svg>
