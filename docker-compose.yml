x-superset-common: &superset-common
  image: apache/superset:4.1.1
  user: root
  environment:
    SUPERSET_CONFIG_PATH: /app/docker/superset_config.py
    SUPERSET_SECRET_KEY: "change-this-to-a-long-random-text-1234567890"
    SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://postgres:admin@postgres:5432/postgres"
  volumes:
    - ./docker:/app/docker
    - superset_home:/app/superset_home
  networks:
    - my_network

services:

  postgres:
      image: postgres:16
      container_name: postgres
      restart: unless-stopped
      environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres

      volumes:
       - postgres_data:/var/lib/postgresql/data
         
      ports:
        - "5566:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - my_network
  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: fadwaharrabi58@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "8088:80"

    depends_on:
      postgres:
        condition: service_healthy


    networks:
      - my_network
  flyway:
    image: flyway/flyway:latest
    container_name: flyway
    depends_on:
      postgres:
          condition: service_healthy
    command: >
          -url=jdbc:postgresql://postgres:5432/OlistBronze
          -user=postgres
          -password=admin
          -locations=filesystem:/flyway/sql
          migrate

    volumes:
      - ./database_schema:/flyway/sql
    networks:
      - my_network
  redis:
    image: redis:7
    container_name: superset_cache
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - my_network

  superset-init:
    <<: *superset-common
    container_name: superset_init
    command: >
      sh -c "pip install psycopg2-binary &&
             superset db upgrade &&
             superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin &&
             superset init"
    depends_on:
      postgres:
        condition: service_healthy

  superset:
    <<: *superset-common
    container_name: superset_app
    command: >
      sh -c "pip install psycopg2-binary &&
             gunicorn --bind 0.0.0.0:8088 --workers 2 --timeout 120 'superset.app:create_app()'"
    restart: unless-stopped
    ports:
      - "8089:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully

networks:
   my_network:
        driver: bridge

volumes:
  postgres_data:
  superset_home:
  redis_data: