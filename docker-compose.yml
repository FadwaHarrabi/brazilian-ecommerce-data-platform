services:

  postgres:
      image: postgres:16
      container_name: postgres
      restart: unless-stopped
      environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres

      volumes:
       - postgres_data:/var/lib/postgresql/data
         
      ports:
        - "5566:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - my_network
  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: fadwaharrabi58@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "8088:80"

    depends_on:
      postgres:
        condition: service_healthy


    networks:
      - my_network
  flyway:
    image: flyway/flyway:latest
    container_name: flyway
    depends_on:
      postgres:
          condition: service_healthy
    command: >
          -url=jdbc:postgresql://postgres:5432/OlistBronze
          -user=postgres
          -password=admin
          -locations=filesystem:/flyway/sql
          migrate

    volumes:
      - ./database_schema:/flyway/sql
    networks:
      - my_network


networks:
   my_network:
        driver: bridge

volumes:
  postgres_data: